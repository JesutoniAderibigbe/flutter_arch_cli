name: flutter_arch_cli
description: A CLI tool to scaffold Flutter projects with your chosen architecture, state management, and production-ready extras.
version: 0.3.1
homepage: https://github.com/JesutoniAderibigbe/flutter_arch_cli
repository: https://github.com/JesutoniAderibigbe/flutter_arch_cli
issue_tracker: https://github.com/JesutoniAderibigbe/flutter_arch_cli/issues

topics:
  - flutter
  - cli
  - scaffolding
  - architecture
  - state-management

environment:
  sdk: ^3.5.0

executables:
  flutter_arch: flutter_arch_cli

dependencies:
  args: ^2.5.0
  interact: ^2.2.0
  path: ^1.9.0
  yaml_edit: ^2.2.0
  mason_logger: ^0.3.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0